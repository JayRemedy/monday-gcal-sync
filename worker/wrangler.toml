name = "monday-gcal-webhook"
main = "src/index.js"
compatibility_date = "2026-06-24"

[vars]
GITHUB_OWNER = "JayRemedy"
GITHUB_REPO = "monday-gcal-sync"
MONDAY_BOARD_ID = "1234567890"
# Set this to a generated hard-to-guess path before production.
WEBHOOK_PATH = "/monday-gcal-example"

# Secrets to set with wrangler:
# wrangler secret put GITHUB_DISPATCH_TOKEN
# Optional hardening if you proxy/customize inbound calls:
# wrangler secret put INBOUND_SECRET
