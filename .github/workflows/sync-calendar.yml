name: Sync Monday to Google Calendar

on:
  repository_dispatch:
    types: [monday_webhook]
  workflow_dispatch:
  schedule:
    # Backup catch-up sync in case any webhook dispatch is missed.
    - cron: '*/15 * * * *'

concurrency:
  group: monday-jd-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync calendar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Monday → Google Calendar sync
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          MONDAY_BOARD_ID: '18419165433'
          MONDAY_BOARD_NAME: JunkDoctors
          GOOGLE_CALENDAR_NAME: 'Mon: JunkDoctors'
          GOOGLE_CALENDAR_TIMEZONE: America/New_York
        run: python3 scripts/sync_monday_junkdoctors_calendar.py
